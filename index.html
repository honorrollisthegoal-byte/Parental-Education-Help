<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Honor Roll is the Goal</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2fc;font:17px system-ui;color:#1b2d53}.app{max-width:520px;min-height:100vh;margin:auto;background:#f8faff;padding-bottom:90px}header{background:#162e60;color:white;padding:22px;border-radius:0 0 24px 24px}h1{font-size:24px;margin:0}header p{margin:5px 0 0}main{padding:18px}.card{background:white;padding:20px;border-radius:18px;margin-bottom:16px;box-shadow:0 3px 14px #162e6012}h2{font-size:24px;margin:0 0 12px}h3{font-size:19px;margin:0 0 10px}p{line-height:1.5}button,input,select{font:inherit}button{background:#162e60;color:white;border:0;border-radius:12px;padding:13px;cursor:pointer;font-weight:700}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d7a900}button.gold{background:#ffcb47;color:#182d56}button.light{background:#eaf0ff;color:#182d56}.full{display:block;width:100%;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{min-height:90px}input,select{width:100%;padding:12px;border:2px solid #cdd9ed;border-radius:12px;margin:8px 0 12px}.muted{font-size:14px;color:#54637d}.note{background:#edf4ff;padding:12px;border-radius:12px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:white;border-top:1px solid #d5e0ef;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}.bottom button{background:white;color:#213963;font-size:13px;padding:12px 3px}.bottom button.active{background:#fff1c3}.parts{display:flex;gap:4px;margin:20px 0}.parts span{flex:1;height:70px;border:2px solid #172d59}.parts span:nth-child(-n+2){background:#ffcb47}.answer{width:100%;text-align:left;background:#eaf0ff;color:#192e57;margin:6px 0}.hide{display:none}
</style></head><body><div class="app"><header><h1>⭐ Honor Roll is the Goal</h1><p>Learn together, one step at a time.</p></header><main id="view"></main><nav class="bottom"><button onclick="go('home')" id="home">🏠<br>Home</button><button onclick="go('search')" id="search">🔎<br>Search</button><button onclick="go('progress')" id="progress">⭐<br>Progress</button><button onclick="go('account')" id="account">👤<br>Account</button></nav></div><script>
let page='welcome',child='Jacob',grade='3',stars=0,completed=0,query='';const view=document.getElementById('view');const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(p){page=p;render();window.scrollTo(0,0)}function find(){query=document.getElementById('q').value;go('results')}function speak(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById('micnote').textContent='Voice search is not available in this browser. Please type your question.';return}let r=new R();r.lang='en-US';r.onresult=e=>{document.getElementById('q').value=e.results[0][0].transcript;document.getElementById('micnote').textContent='Great! Tap Find Help.'};r.onerror=()=>document.getElementById('micnote').textContent='Could not hear. Please type your question.';r.start()}function check(n){document.querySelectorAll('.answer').forEach(b=>b.disabled=true);document.getElementById('feedback').innerHTML=n===2?'<p>🌟 Correct! Two of four equal parts are shaded.</p><button class="gold full" onclick="finish()">Finish and earn 10 stars</button>':'<p>Good try! Count all four equal parts, then the two gold parts.</p><button class="light full" onclick="go(\'practice\')">Try again</button>'}function finish(){stars+=10;completed++;go('success')}function save(){child=document.getElementById('child').value.trim()||'My child';grade=document.getElementById('grade').value;go('home')}function render(){let h='';if(page==='welcome')h=`<div class="card"><h2>Welcome, families! 🌟</h2><p>Simple Reading and Math activities for learning at home.</p><button class="gold full" onclick="go('home')">Start Exploring Free</button><p class="muted">Demonstration only. No account or payment needed.</p></div>`;if(page==='home')h=`<div class="card"><h2>Hello, learning family!</h2><p>Learning with <b>${safe(child)}</b> · Grade ${safe(grade)}</p></div><div class="card"><h3>What can we help with today?</h3><button class="gold full" onclick="go('search')">🔎 Find learning help</button><div class="grid"><button onclick="query='fractions';go('results')">🔢 Math</button><button onclick="query='reading';go('results')">📚 Reading</button></div></div><div class="card"><h3>Try a learning pack</h3><p>Grade 3 Math: Understanding Fractions</p><button class="full" onclick="go('lesson')">Start lesson →</button></div>`;if(page==='search')h=`<div class="card"><h2>Find learning help 🔎</h2><label for="q">What does your child need help with?</label><input id="q" value="${safe(query)}" placeholder="My third grader needs help with fractions" onkeydown="if(event.key==='Enter')find()"><button class="light full" onclick="speak()">🎤 Speak your question</button><p id="micnote" class="muted">You can type or try the microphone.</p><button class="gold full" onclick="find()">Find Help →</button></div><div class="card"><h3>Example search</h3><button class="light full" onclick="query='My third grader needs help with fractions';go('results')">Grade 3 fractions</button></div>`;if(page==='results')h=`<div class="card"><h2>Search results</h2><p class="muted">You searched: “${safe(query||'Learning help')}”</p><h3>Understanding Fractions</h3><p>Grade 3 Math · Lesson and practice</p><button class="gold full" onclick="go('lesson')">Open learning pack →</button></div><div class="card note">This starter version has one complete sample learning pack. We can add Reading and other grades next.</div>`;if(page==='lesson')h=`<div class="card"><h2>What is a fraction?</h2><p>A fraction shows how many <b>equal parts</b> of a whole we have.</p><div class="parts" aria-label="Four equal parts, two shaded"><span></span><span></span><span></span><span></span></div><p>Four equal parts. Two are shaded gold. That is <b>2/4</b>, or two fourths.</p><button class="light full" onclick="document.getElementById('other').classList.toggle('hide')">Show Me Another Way</button><p id="other" class="note hide">Imagine a sandwich cut into four equal pieces. Eating two pieces is eating 2/4 of the sandwich.</p><button class="gold full" onclick="go('practice')">Let's Practice →</button></div>`;if(page==='practice')h=`<div class="card"><h2>Let's practice! ✏️</h2><p>Two of these four equal parts are gold.</p><div class="parts" aria-label="Four equal parts, two shaded"><span></span><span></span><span></span><span></span></div><h3>What fraction is shaded?</h3><button class="answer" onclick="check(1)">A. 1/4</button><button class="answer" onclick="check(2)">B. 2/4</button><button class="answer" onclick="check(3)">C. 4/2</button><div id="feedback" aria-live="polite"></div><button class="light full" onclick="go('lesson')">Review lesson</button></div>`;if(page==='success')h=`<div class="card" style="text-align:center"><div style="font-size:64px">⭐</div><h2>You did it!</h2><p>Great effort! You completed the fractions learning pack.</p><h2>+10 Gold Stars</h2><button class="gold full" onclick="go('progress')">See My Progress →</button></div>`;if(page==='progress')h=`<div class="card"><h2>${safe(child)}'s Progress ⭐</h2><h3>${stars} Gold Stars</h3><p>${completed} learning pack${completed===1?'':'s'} completed</p><p>${completed?'Making progress! Keep learning.':'Complete a lesson to see progress here.'}</p><button class="gold full" onclick="go('lesson')">Practice Fractions</button></div><div class="card"><p>Stars celebrate effort and completion, not comparisons with other children.</p></div>`;if(page==='account')h=`<div class="card"><h2>Parent Account 👤</h2><label for="child">Child's first name or nickname</label><input id="child" maxlength="30" value="${safe(child)}"><label for="grade">Grade</label><select id="grade">${['Pre-K','K','1','2','3','4','5'].map(g=>`<option ${g===grade?'selected':''}>${g}</option>`).join('')}</select><button class="gold full" onclick="save()">Save profile</button></div><div class="card"><h3>Membership plan</h3><p>Our proposed offer: 30 days free, then $20 per month only if a parent chooses to subscribe.</p><p class="note muted">Demo only. No real accounts, charges, or subscriptions. Progress resets when the page reloads. Please do not enter sensitive information.</p></div>`;view.innerHTML=h;document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));let active=['welcome','lesson','practice','success'].includes(page)?'home':page==='results'?'search':page;document.getElementById(active)?.classList.add('active')}render();
</script></body></html>
